name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]

    env:
      CC: ${{ matrix.cc }}

    steps:
      # The suite lives in the test-runner submodule, so a shallow checkout
      # without it would leave nothing to run.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fails if the submodule and the Makefile's RUNNER_VERSION disagree.
      - name: Verify pinned test-runner
        run: make verify-runner

      - name: Build and test
        run: make check

      - name: Test under ASan and UBSan
        run: make sanitize

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      # `make docs` reads only minesweeper.c, README.md and docs/, so this job
      # does not need the submodule.
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version

      # Doxyfile sets WARN_AS_ERROR, so an undocumented parameter or an
      # unresolved reference fails here the same way a failing test would.
      - name: Build reference
        run: make docs

      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen/html
          if-no-files-found: error
